name: release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id (default: UTC timestamp). Must be unique."
        required: false
        default: ""
      allow_key_rotation:
        description: "Confirm replacement of the remote key.asc trust anchor."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: apt-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish (manual, serialized)
    runs-on: ubuntu-24.04
    container: debian:13
    environment: apt-production
    env:
      APT_S3_BUCKET: ${{ secrets.APT_S3_BUCKET }}
      APT_S3_ENDPOINT: ${{ secrets.APT_S3_ENDPOINT }}
      APT_S3_REGION: ${{ secrets.APT_S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.APT_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.APT_S3_SECRET_ACCESS_KEY }}
      APT_SIGNING_FINGERPRINT: ${{ secrets.APT_SIGNING_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system tools
        run: apt-get update && apt-get install -y --no-install-recommends apt apt-utils file xz-utils gpg python3 curl ca-certificates && rm -rf /var/lib/apt/lists/*
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests
      - name: Import release signing key into an isolated homedir
        run: |
          set -euo pipefail
          if [ -z "${APT_RELEASE_SIGNING_KEY:-}" ]; then
            echo "APT_RELEASE_SIGNING_KEY environment secret is required" >&2
            exit 1
          fi
          if [ -z "${APT_SIGNING_FINGERPRINT:-}" ]; then
            echo "APT_SIGNING_FINGERPRINT secret is required for production verify" >&2
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_RELEASE_SIGNING_KEY" >"$RUNNER_TEMP/release-private.asc"
          chmod 600 "$RUNNER_TEMP/release-private.asc"
          gpg --batch --import "$RUNNER_TEMP/release-private.asc"
          {
            echo "APT_SIGNING_KEY_FILE=$RUNNER_TEMP/release-private.asc"
            echo "APT_SIGNING_KEY_ID=$APT_SIGNING_FINGERPRINT"
            echo "GNUPGHOME=$GNUPGHOME"
          } >>"$GITHUB_ENV"
        env:
          APT_RELEASE_SIGNING_KEY: ${{ secrets.APT_RELEASE_SIGNING_KEY }}
      - name: Build release
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_ID_INPUT" ]; then
            uv run python -m scripts.repo build --output dist/repo --release-id "$RELEASE_ID_INPUT"
          else
            uv run python -m scripts.repo build --output dist/repo
          fi
        env:
          RELEASE_ID_INPUT: ${{ inputs.release_id }}
      - name: Verify against the trusted fingerprint
        run: |
          set -euo pipefail
          if [ -z "${APT_SIGNING_FINGERPRINT:-}" ]; then
            echo "APT_SIGNING_FINGERPRINT secret is required for production verify" >&2
            exit 1
          fi
          uv run python -m scripts.repo verify --output dist/repo
          test "$(find dist/repo/pool -maxdepth 1 -name '*.deb' | wc -l)" = "4"
      - name: Publish pool, indices, and release; pointer last
        run: |
          set -euo pipefail
          if [ "$ALLOW_KEY_ROTATION_INPUT" = "true" ]; then
            uv run python -m scripts.repo publish --output dist/repo --allow-key-rotation
          else
            uv run python -m scripts.repo publish --output dist/repo
          fi
        env:
          ALLOW_KEY_ROTATION_INPUT: ${{ inputs.allow_key_rotation }}
      - name: Scrub isolated key material
        if: always()
        run: rm -rf "${GNUPGHOME:-/nonexistent}" "$RUNNER_TEMP/release-private.asc" || true
