name: worker-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy authenticated Worker gateway (manual only)
    runs-on: ubuntu-24.04
    environment: apt-production
    env:
      APT_WORKER_DOMAIN: ${{ vars.APT_WORKER_DOMAIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Validate production domain and credentials
        run: |
          set -euo pipefail
          if [ -z "${APT_WORKER_DOMAIN:-}" ]; then
            echo "APT_WORKER_DOMAIN repository variable is required; operator must supply the Worker custom domain before deploy" >&2
            exit 1
          fi
          if ! printf '%s' "$APT_WORKER_DOMAIN" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'; then
            echo "APT_WORKER_DOMAIN is not a valid bare hostname" >&2
            exit 1
          fi
          if printf '%s' "$APT_WORKER_DOMAIN" | grep -Eq '://|/'; then
            echo "APT_WORKER_DOMAIN must be a bare hostname without scheme or path" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is required for production deploy" >&2
            exit 1
          fi
          if [ -z "${WORKER_CREDENTIALS:-}" ]; then
            echo "CREDENTIALS secret is required for production deploy" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const raw = process.env.WORKER_CREDENTIALS ?? "";
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch {
              console.error("CREDENTIALS secret is not valid JSON");
              process.exit(1);
            }
            const namePattern = /^[A-Za-z0-9._-]{1,64}$/;
            const digestPattern = /^[0-9a-fA-F]{64}$/;
            const entries = (parsed !== null && typeof parsed === "object" && !Array.isArray(parsed))
              ? Object.entries(parsed)
              : [];
            if (entries.length === 0) {
              console.error("CREDENTIALS secret must be a non-empty JSON object");
              process.exit(1);
            }
            for (const [name, digest] of entries) {
              if (!namePattern.test(name) || typeof digest !== "string" || !digestPattern.test(digest)) {
                console.error("CREDENTIALS secret has an invalid device entry");
                process.exit(1);
              }
            }
            const target = process.env.RUNNER_TEMP + "/worker-secrets.json";
            fs.writeFileSync(target, JSON.stringify({ CREDENTIALS: raw }) + "\n", { mode: 0o600 });
          '
          chmod 600 "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_CREDENTIALS: ${{ secrets.CREDENTIALS }}
      - name: Deploy the gateway (bucket stays private, no R2 exposure)
        run: |
          set -euo pipefail
          bunx wrangler deploy --config worker/wrangler.jsonc --domains "$APT_WORKER_DOMAIN" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 12412d5b061683494ea3e5c217d6a961
      - name: Scrub generated secret material
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json" || true
