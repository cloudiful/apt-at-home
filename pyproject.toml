[project]
name = "apt-at-home"
version = "0.1.0"
description = "Local artifact build and safe publication tooling for a private Debian APT repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
